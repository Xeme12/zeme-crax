<html lang="en">
<head>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b0b;color:#fff;font-family:Arial,sans-serif;padding:20px}

h1{text-align:center;font-size:22px;margin:0 0 28px}

.url-row{display:flex;gap:8px;align-items:center}
.url{flex:1;min-width:0;background:#222;border:1px solid #333;color:#ddd;padding:12px;border-radius:9px;font-size:12px;overflow:auto;white-space:nowrap}
.copy{border:0;background:#fff;color:#111;padding:12px 13px;border-radius:9px;font-weight:bold;cursor:pointer}
.status{text-align:center;height:18px;margin-top:8px;font-size:12px;color:#5ee58a}
footer{text-align:center;margin-top:30px;color:#888;font-size:13px}
</style>
</head>
<body>
<div class="box">
<h1>ZEME CRAX ADMIN VIP KEY PAID OR FREE</h1>

<h2>BUY PAID KEY</h2>
<p class="note">Copy and Paste Chrome browser</p>
<div class="url-row">
<div class="url" id="paidUrl">https://wa.me/8801333412988?text=I%20WANT%20TO%20BUY%20A%20PAID%20VIP%20KEY</div>
<button class="copy" onclick="copyUrl('paidUrl','paidStatus')">Copy URL</button>

</div>

</div>

<script>
function copyUrl(id,statusId){
 const text=document.getElementById(id).textContent.trim();
 navigator.clipboard.writeText(text).then(()=>show(statusId)).catch(()=>{
  const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);
  t.select();document.execCommand('copy');t.remove();show(statusId);
 });
}
function show(id){
 document.getElementById(id).textContent='Copied!';
 setTimeout(()=>document.getElementById(id).textContent='',1500);
}
</script>
